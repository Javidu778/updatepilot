name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # prisma.config.ts needs a value to load. Generating the client does not connect to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w apps/api

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Informational: reports known vulnerabilities in dependencies (threat model T-19).
  # Not a required check, so a third-party advisory never blocks a merge.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
